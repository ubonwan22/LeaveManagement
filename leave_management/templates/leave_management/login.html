{% load static %}
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>เข้าสู่ระบบ | ระบบลางานออนไลน์</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="{% static 'leave_management/favicon.png' %}">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['"Noto Sans Thai"', 'sans-serif'] } } } }
  </script>
</head>
<body class="flex min-h-screen items-center justify-center bg-slate-50 px-4 font-sans text-slate-800">
  {% include 'leave_management/_toast.html' %}
  <div class="w-full max-w-sm rounded-2xl border border-slate-200 bg-white p-8 shadow-sm">
    <div class="mb-6 text-center">
      <div class="text-4xl">🗓️</div>
      <h1 class="mt-2 text-xl font-bold text-sky-600">ระบบลางานออนไลน์</h1>
      <p class="mt-1 text-sm text-slate-500">กรุณาเข้าสู่ระบบเพื่อใช้งาน</p>
    </div>

    {% if form.errors %}
      <div class="mb-4 rounded-lg border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-800">
        ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง
      </div>
    {% endif %}

    <form method="post" class="space-y-4">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      <div>
        <label for="id_username" class="mb-1 block text-sm font-medium">ชื่อผู้ใช้</label>
        <input type="text" name="username" id="id_username" required autofocus autocomplete="username"
               class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:border-sky-500 focus:outline-none focus:ring-2 focus:ring-sky-200">
      </div>
      <div>
        <label for="id_password" class="mb-1 block text-sm font-medium">รหัสผ่าน</label>
        <input type="password" name="password" id="id_password" required autocomplete="current-password"
               class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:border-sky-500 focus:outline-none focus:ring-2 focus:ring-sky-200">
      </div>
      <button type="submit" class="w-full rounded-lg bg-sky-600 py-2.5 font-semibold text-white hover:bg-sky-700">เข้าสู่ระบบ</button>
    </form>
  </div>
</body>
</html>
